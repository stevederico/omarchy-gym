# Merge this block into your Hyprland bindings source.
# Keep the normal/global bindings before this block so a submap exit does not
# propagate a key event into a later global binding.

submap = omarchy-gym

# These controls are intentionally not playable chart entries.
bind = SUPER, W, exec, omarchy-shell shell hide io.github.stevederico.omarchy-gym
bind = , F12, exec, omarchy-shell shell hide io.github.stevederico.omarchy-gym

# Do not bind the remaining keys here: unbound chords must reach Gym's Qt
# key catcher for scoring.
submap = reset
