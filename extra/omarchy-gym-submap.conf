# Merge this block into your Hyprland bindings source (hyprlang config).
# Keep the normal/global bindings before this block so a submap exit does not
# propagate a key event into a later global binding.
#
# Gym enters this submap only while its window has keyboard focus. hyprlang
# has no key listener, so Gym scores only the chords its window receives.
# On Omarchy Quattro (Lua config) use omarchy-gym-submap.lua instead.

submap = omarchy-gym

# Close Gym. This control is not a playable chart entry.
bind = SUPER, W, exec, omarchy-shell shell hide io.github.stevederico.omarchy-gym
# Failsafe: always leaves the submap, even if omarchy-shell is not running.
bind = , F12, submap, reset

# Do not bind the remaining keys here: unbound chords must reach Gym's Qt
# key catcher for scoring.
submap = reset
